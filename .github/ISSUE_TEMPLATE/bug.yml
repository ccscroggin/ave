name: Something is broken
description: The app does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected, and what happened instead." }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Phone or computer and browser, placeholder: "iPhone 15, Safari" }
